<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Agent</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-layout">
    <header class="app-header">
      <div class="badge-pill">Autonomous Guidance Engine</div>
      <h1>AI Career Agent</h1>

        <div class="progress-bar" id="progress-bar" style="width: 20%;"></div>
      </div>
      <p id="progress-indicator">Step 1 of 5</p>

    <main id="card-container">
      <!-- Cards render dynamically here -->
    </main>

  <!-- ui.js handles importing taxonomy, state, and routing internally -->
  <script type="module" src="js/ui.js"></script>
